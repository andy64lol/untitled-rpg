name: CI Linux ARM64

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Linux ARM64 (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libgl1-mesa-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libx11-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu

      - name: Test
        run: cargo test --locked --target aarch64-unknown-linux-gnu
