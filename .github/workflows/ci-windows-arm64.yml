name: CI Windows ARM64

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows ARM64 (aarch64-pc-windows-msvc)
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --target aarch64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target aarch64-pc-windows-msvc
